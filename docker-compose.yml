services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: event_processor
      POSTGRES_USER: events_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events_app -d event_processor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
