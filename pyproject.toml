[project]
name = "fault-tolerant-event-processor"
version = "0.1.0"
description = "A fault-tolerant Kafka event processing system"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
